<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>matuge-change PoC — 静止画モード（まつ毛Alpha抽出）</title>
<link rel="stylesheet" href="/common.css">
<style>
  #stage { position: relative; margin: 12px auto; overflow: auto; max-width: 98vw; height: 72vh; background: #111; }
  #canvasWrap { position: relative; transform-origin: 0 0; }
  canvas { position: absolute; left: 0; top: 0; image-rendering: auto; }
  #baseCanvas { position: relative; }
  #zoomLabel { display: inline-block; min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
  .brush-active { outline: 2px solid #ff5; }
  #progress { height: 6px; background: #333; border-radius: 3px; overflow: hidden; width: 220px; }
  #progressBar { height: 100%; width: 0; background: #4a6cf7; transition: width .2s; }
  .roi-overlay { position: absolute; display: none; pointer-events: none; box-sizing: border-box; }
  #roiOverlayA { border: 2px solid #00e5ff; background: rgba(0,229,255,.12); }
  #roiOverlayB { border: 2px dashed #ff9f1c; background: rgba(255,159,28,.12); }
  .roi-overlay::before { position: absolute; left: 3px; top: 1px; font-weight: bold; }
  #roiOverlayA::before { content: 'A'; color: #00e5ff; }
  #roiOverlayB::before { content: 'B'; color: #ff9f1c; }
  #roiHint { font-size: 13px; color: #ffd; }
</style>
</head>
<body>
<header><h1>matuge-change PoC — まつ毛 Alpha 抽出（商品＋自まつ毛）</h1></header>

<nav>
  <a href="/">カタログ</a>
  <a href="/extract.html" class="nav-active">静止画モード</a>
  <a href="/video.html">動画モード</a>
</nav>

<div class="bar" id="controls">
  <label>① 装着画像: <input type="file" id="fileWith" accept="image/*"></label>
  <label>未装着画像(任意): <input type="file" id="fileWithout" accept="image/*"></label>
  <label>目元の指定:
    <select id="roiMode">
      <option value="auto">正面（顔検出で自動）</option>
      <option value="manual">横顔・目のアップ（手動ROI）</option>
    </select>
  </label>
  <span id="roiControls" style="display:none">
    <button id="roiBtnA" class="secondary">ROI-A 指定（装着画像）</button>
    <button id="roiBtnB" class="secondary">ROI-B 指定（加工画像）</button>
    <button id="roiClear" class="secondary">ROIクリア</button>
    <label><input type="checkbox" id="roiShow" checked> ROI枠を表示</label>
  </span>
  <span id="roiHint"></span>
  <button id="btnUpload">② 解析開始</button>
  <label>セッションID <input type="text" id="sessionId" size="12" placeholder="作業を再開"></label>
  <button id="btnResume" class="secondary">再開</button>
  <button id="btnArchive" class="secondary" title="セッションの画像一式をSupabase Storageへ退避">退避</button>
  <button id="btnArchiveRestore" class="secondary" title="退避済みセッションをこのサーバへ復元">取り込み</button>
  <span class="sep"></span>
  <label>表示:
    <select id="layerSelect">
      <option value="roi_a">Original (装着)</option>
    </select>
  </label>
  <label>ズーム:
    <button id="btnZoomOut" class="secondary">−</button>
    <span id="zoomLabel">100%</span>
    <button id="btnZoomIn" class="secondary">＋</button>
    <button id="btnZoomFit" class="secondary">全体</button>
    <button id="btnZoomReset" class="secondary">100%</button>
  </label>
  <label>ブラシ:
    <button id="btnAdd" class="secondary">＋ 商品</button>
    <button id="btnUnknown" class="secondary">？ 中間</button>
    <button id="btnRemove" class="secondary">− 背景</button>
    <button id="btnNone" class="secondary">オフ</button>
  </label>
  <label>サイズ <input type="range" id="brushSize" min="2" max="60" value="14"></label>
  <button id="btnUndo" class="secondary" disabled>↶ 元に戻す</button>
  <button id="btnRedo" class="secondary" disabled>↷ やり直す</button>
  <button id="btnClear" class="secondary">ブラシ消去</button>
  <span class="sep"></span>
  <label>FG閾値 <input type="range" id="fgThresh" min="30" max="95" value="70"></label>
  <label>BG閾値 <input type="range" id="bgThresh" min="2" max="50" value="18"></label>
  <button id="btnMatte">③ Matting実行</button>
  <span class="sep"></span>
  <label>編集済み画像: <input type="file" id="fileEdited" accept="image/*"></label>
  <button id="btnRecompose">④ 再合成（顔検出で自動）</button>
  <a id="btnDownload" download><button class="secondary">表示中レイヤーを保存</button></a>
  <div id="progress"><div id="progressBar"></div></div>
</div>

<div class="bar" id="register">
  <label>商品名 <input type="text" id="assetName" placeholder="ボリュームラッシュ D 0.07"></label>
  <label>ブランド <input type="text" id="assetBrand" placeholder="任意"></label>
  <button id="btnRegister">この抽出結果を商品として登録</button>
  <a href="/"><button class="secondary">カタログを開く</button></a>
  <span id="catalogInfo" style="font-size:13px;color:#9fd"></span>
</div>

<div class="status" id="status">① 装着画像を選ぶ →②「解析開始」→（必要ならブラシで補正）→③「Matting実行」。</div>

<div id="stage">
  <div id="canvasWrap">
    <canvas id="baseCanvas"></canvas>
    <canvas id="paintCanvas"></canvas>
    <div id="roiOverlayA" class="roi-overlay"></div>
    <div id="roiOverlayB" class="roi-overlay"></div>
  </div>
</div>

<script>
const state = {
  session: null, w: 0, h: 0, brush: null, painting: false, layer: 'roi_a',
  strokes: [], current: null, supabase: null, channel: null,
  zoom: 1, localUrls: {}, roiRect: null, roiA: null, roiB: null, activeRoi: null,
};
const TOOL_OF = { add: 'fg', unknown: 'unknown', remove: 'bg' };
const COLOR_OF = { fg: '#ff2020', unknown: '#20c040', bg: '#2040ff' };
const baseCanvas = document.getElementById('baseCanvas');
const paintCanvas = document.getElementById('paintCanvas');
const stage = document.getElementById('stage');
const canvasWrap = document.getElementById('canvasWrap');
const bctx = baseCanvas.getContext('2d');
const pctx = paintCanvas.getContext('2d');
const status = (msg) => document.getElementById('status').textContent = msg;

// fetch は通信断・ファイル読み取り失敗で reject するため、必ず捕まえて理由を表示する
async function postForm(url, fd) {
  let res;
  try {
    res = await fetch(url, { method: 'POST', body: fd });
  } catch (e) {
    throw new Error(`送信に失敗しました（選択したファイルが移動・削除された、またはサーバーに接続できません）: ${e.message}`);
  }
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

const LAYER_NAMES = {
  roi_a: 'Original (装着)', roi_b: 'Aligned (未装着)', difference: 'Difference',
  probability: 'Probability', trimap: 'Trimap', alpha: 'Alpha',
  product_rgba: 'Product RGBA', composite_on_bare: '未装着画像へ再合成',
  composite_on_edited: '編集済み画像へ再合成',
  source_with: '元画像 (装着)', source_without: '元画像 (未装着)',
  source_edited: '元画像 (AI加工済み)',
  local_with: '選択した画像 (装着)', local_without: '選択した画像 (未装着)',
  local_edited: '選択した画像 (AI加工済み)'
};

function setLayerOptions(layers) {
  const sel = document.getElementById('layerSelect');
  const current = sel.value;
  sel.innerHTML = '';
  // 解析後もアップロード直後のプレビューを見比べられるよう local_* を末尾に残す
  const all = [...layers, ...Object.keys(state.localUrls).filter(l => !layers.includes(l))];
  for (const l of all) {
    const opt = document.createElement('option');
    opt.value = l; opt.textContent = LAYER_NAMES[l] || l;
    sel.appendChild(opt);
  }
  // 解析・Matting 後は結果を見せたいので、プレビュー表示中なら新しいサーバ側レイヤーへ切り替える
  const keep = current && all.includes(current) && !isLocalLayer(current);
  sel.value = keep ? current : (layers[layers.length - 1] || all[all.length - 1]);
  return showLayer(sel.value);
}

const isSourceLayer = (name) => name.startsWith('source_');
// local_* は解析（セッション作成）前に選択したファイルをブラウザ内で表示するための擬似レイヤー
const isLocalLayer = (name) => name.startsWith('local_');
const isViewOnlyLayer = (name) => isSourceLayer(name) || isLocalLayer(name);

function applyZoom() {
  canvasWrap.style.transform = `scale(${state.zoom})`;
  canvasWrap.style.width = baseCanvas.width * state.zoom + 'px';
  canvasWrap.style.height = baseCanvas.height * state.zoom + 'px';
  document.getElementById('zoomLabel').textContent = Math.round(state.zoom * 100) + '%';
}
function setZoom(z) {
  state.zoom = Math.min(8, Math.max(0.05, z));
  applyZoom();
}
function fitZoom() {
  if (!baseCanvas.width) return;
  const pad = 4;
  setZoom(Math.min(
    (stage.clientWidth - pad) / baseCanvas.width,
    (stage.clientHeight - pad) / baseCanvas.height,
  ));
}
document.getElementById('btnZoomIn').onclick = () => setZoom(state.zoom * 1.25);
document.getElementById('btnZoomOut').onclick = () => setZoom(state.zoom / 1.25);
document.getElementById('btnZoomFit').onclick = fitZoom;
document.getElementById('btnZoomReset').onclick = () => setZoom(1);
stage.addEventListener('wheel', (e) => {
  if (!e.ctrlKey) return;  // Ctrl+ホイールでズーム、素のホイールはスクロールのまま
  e.preventDefault();
  setZoom(state.zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
}, { passive: false });

// 表示完了を待てるよう Promise を返す（ストローク再生はキャンバスのリサイズ後に行う必要がある）
function showLayer(name) {
  state.layer = name;
  const local = isLocalLayer(name);
  if (!local && !state.session) return Promise.resolve(false);
  const src = local ? state.localUrls[name] : `/api/image/${state.session}/${name}?t=${Date.now()}`;
  if (!src) return Promise.resolve(false);
  const dl = document.getElementById('btnDownload');
  dl.href = local ? state.localUrls[name] : `/api/image/${state.session}/${name}`;
  dl.setAttribute('download', `${name}.png`);
  const img = new Image();
  return new Promise((resolve) => {
    img.onload = () => {
      // 元画像は目元ROIと解像度が違うので、ブラシ用キャンバスのサイズ（=制約PNGのサイズ）は変えない
      const viewOnly = isViewOnlyLayer(name);
      baseCanvas.width = img.width;
      baseCanvas.height = img.height;
      if (!viewOnly) {
        paintCanvas.width = state.w = img.width;
        paintCanvas.height = state.h = img.height;
      }
      paintCanvas.style.display = viewOnly ? 'none' : 'block';
      if (viewOnly) setBrush(null, null);
      stage.classList.toggle('checker', name === 'product_rgba');
      bctx.clearRect(0, 0, img.width, img.height);
      bctx.drawImage(img, 0, 0);
      // 全身の元画像は等倍だと画面に収まらないので、初期表示は全体が見えるズーム率にする
      if (img.width > stage.clientWidth || img.height > stage.clientHeight) fitZoom();
      else setZoom(1);
      restorePaint();
      drawRoiOverlay();
      resolve(true);
    };
    img.onerror = () => {
      status(`エラー: ${LAYER_NAMES[name] || name} を表示できませんでした`);
      resolve(false);
    };
    img.src = src;
  });
}

// 解析を待たずに選択画像を確認できるよう、ファイル選択時点でプレビュー用レイヤーを足す
function registerLocalPreview(inputId, layer) {
  document.getElementById(inputId).addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (state.localUrls[layer]) URL.revokeObjectURL(state.localUrls[layer]);
    if (!file) { delete state.localUrls[layer]; return; }
    state.localUrls[layer] = URL.createObjectURL(file);
    const sel = document.getElementById('layerSelect');
    const layers = [...sel.options].map(o => o.value);
    setLayerOptions(layers.includes(layer) ? layers : [...layers, layer]);
    sel.value = layer;
    showLayer(layer);
  });
}
registerLocalPreview('fileWith', 'local_with');
registerLocalPreview('fileWithout', 'local_without');
document.getElementById('fileWithout').addEventListener('change', () => updateRoiHint());
registerLocalPreview('fileEdited', 'local_edited');

// 横顔・目のアップは顔検出が効かないため、元画像上でドラッグした矩形を目元ROIとして送る
const roiModeSelect = document.getElementById('roiMode');
const roiControls = document.getElementById('roiControls');
const roiOverlayA = document.getElementById('roiOverlayA');
const roiOverlayB = document.getElementById('roiOverlayB');
const roiShow = document.getElementById('roiShow');
const isManualRoi = () => roiModeSelect.value === 'manual';
const roiFor = (kind) => kind === 'a' ? state.roiA : state.roiB;
const isRoiLayer = (name, kind = state.activeRoi) => kind === 'a'
  ? name === 'local_with' || name === 'source_with'
  : name === 'local_edited' || name === 'source_edited';

function drawRoiOverlay() {
  for (const [kind, overlay] of [['a', roiOverlayA], ['b', roiOverlayB]]) {
    const r = roiFor(kind);
    const visible = r && isManualRoi() && roiShow.checked && isRoiLayer(state.layer, kind);
    overlay.style.display = visible ? 'block' : 'none';
    if (visible) {
      overlay.style.left = Math.min(r[0], r[2]) + 'px';
      overlay.style.top = Math.min(r[1], r[3]) + 'px';
      overlay.style.width = Math.abs(r[2] - r[0]) + 'px';
      overlay.style.height = Math.abs(r[3] - r[1]) + 'px';
    }
  }
}

function updateRoiHint() {
  const hint = document.getElementById('roiHint');
  roiControls.style.display = isManualRoi() ? 'inline-flex' : 'none';
  for (const [id, kind] of [['roiBtnA', 'a'], ['roiBtnB', 'b']])
    document.getElementById(id).classList.toggle('brush-active', state.activeRoi === kind);
  document.getElementById('btnUpload').textContent = isManualRoi() ? '② 解析開始（ROI-A）' : '② 解析開始';
  document.getElementById('btnRecompose').textContent = isManualRoi()
    ? '④ 再合成（ROI-Bへ貼付）' : '④ 再合成（顔検出で自動）';
  if (!isManualRoi()) { hint.textContent = ''; drawRoiOverlay(); return; }
  const format = (r) => r
    ? `${Math.round(Math.abs(r[2] - r[0]))}×${Math.round(Math.abs(r[3] - r[1]))}px`
    : '未指定';
  // 手動ROIでは顔ランドマーク位置合わせができないので、未装着画像は同じ矩形で切り抜かれる
  const bareWarning = document.getElementById('fileWithout').files[0]
    ? '　⚠ 手動ROIでは未装着画像を位置合わせできません（同じ構図でないなら外してください）'
    : '';
  hint.textContent = `ROI-A ${format(state.roiA)} ／ ROI-B ${format(state.roiB)}` + bareWarning;
  drawRoiOverlay();
}
roiModeSelect.onchange = () => {
  // ROIを引ける状態にするため、手動に切り替えたら装着画像のプレビューへ移動する
  if (isManualRoi() && !isRoiLayer(state.layer) && state.localUrls.local_with) showLayer('local_with');
  updateRoiHint();
};

function fallbackToManualRoi() {
  roiModeSelect.value = 'manual';
  if (state.localUrls.local_with) showLayer('local_with');
  updateRoiHint();
  status('⚠ 顔を検出できませんでした（横顔・目のアップなど）。手動ROIに切り替えました。目元をドラッグして囲んだあと、もう一度「② 解析開始」を押してください。');
}

function armRoi(kind) {
  if (!isManualRoi()) return;
  state.activeRoi = kind;
  setBrush(null, null);
  const target = kind === 'a'
    ? (state.localUrls.local_with ? 'local_with' : 'source_with')
    : (state.localUrls.local_edited ? 'local_edited' : 'source_edited');
  if (target && (state.localUrls[target] || state.session)) showLayer(target);
  drawRoiOverlay();
}
document.getElementById('roiBtnA').onclick = () => armRoi('a');
document.getElementById('roiBtnB').onclick = () => armRoi('b');
document.getElementById('roiClear').onclick = () => {
  state.roiA = null; state.roiB = null; state.roiRect = null;
  state.activeRoi = null;
  updateRoiHint();
};
roiShow.onchange = drawRoiOverlay;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() !== 'h' || /input|textarea|select/i.test(e.target.tagName)) return;
  roiShow.checked = !roiShow.checked;
  drawRoiOverlay();
});

function imagePoint(e) {
  const rect = baseCanvas.getBoundingClientRect();
  return [(e.clientX - rect.left) / state.zoom, (e.clientY - rect.top) / state.zoom];
}

let roiDragging = false;
canvasWrap.addEventListener('pointerdown', (e) => {
  if (!isManualRoi() || !state.activeRoi || !isRoiLayer(state.layer, state.activeRoi)) return;
  const [x, y] = imagePoint(e);
  const rect = [x, y, x, y];
  if (state.activeRoi === 'a') state.roiA = state.roiRect = rect;
  else state.roiB = rect;
  roiDragging = true;
  updateRoiHint();
});
canvasWrap.addEventListener('pointermove', (e) => {
  if (!roiDragging) return;
  const [x, y] = imagePoint(e);
  const rect = state.activeRoi === 'a' ? state.roiA : state.roiB;
  rect[2] = x; rect[3] = y;
  updateRoiHint();
});
window.addEventListener('pointerup', () => {
  if (!roiDragging) return;
  roiDragging = false;
  state.activeRoi = null;
  updateRoiHint();
});
updateRoiHint();

let paintBackup = null;
const undoStack = [], redoStack = [];
const MAX_HISTORY = 30;
function restorePaint() {
  if (paintBackup) pctx.putImageData(paintBackup, 0, 0);
}
function updateHistoryButtons() {
  document.getElementById('btnUndo').disabled = !undoStack.length;
  document.getElementById('btnRedo').disabled = !redoStack.length;
}
function resetHistory() {
  undoStack.length = 0; redoStack.length = 0;
  updateHistoryButtons();
}
function savePaint() {
  undoStack.push(paintBackup);
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack.length = 0;
  paintBackup = pctx.getImageData(0, 0, state.w, state.h);
  updateHistoryButtons();
}
function applyPaint(snap) {
  paintBackup = snap;
  pctx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
  restorePaint();
  updateHistoryButtons();
}
function undoPaint() {
  if (!undoStack.length) return;
  redoStack.push(paintBackup);
  applyPaint(undoStack.pop());
}
function redoPaint() {
  if (!redoStack.length) return;
  undoStack.push(paintBackup);
  applyPaint(redoStack.pop());
}
document.getElementById('btnUndo').onclick = undoPaint;
document.getElementById('btnRedo').onclick = redoPaint;
window.addEventListener('keydown', (e) => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (k === 'z' && !e.shiftKey) { e.preventDefault(); undoPaint(); }
  else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redoPaint(); }
});

document.getElementById('btnUpload').onclick = async () => {
  const fw = document.getElementById('fileWith').files[0];
  if (!fw) { status('装着画像を選択してください'); return; }
  const fd = new FormData();
  fd.append('image_with', fw);
  const fo = document.getElementById('fileWithout').files[0];
  if (fo) fd.append('image_without', fo);
  if (isManualRoi()) {
    if (!state.roiA) { status('ROI-A 指定を押して装着画像でROIを囲んでください'); return; }
    fd.append('roi_rect', state.roiA.map(Math.round).join(','));
  }
  status(isManualRoi() ? '解析中…（手動ROI・差分計算）' : '解析中…（顔検出・位置合わせ・差分計算）');
  let data;
  try {
    data = await postForm('/api/session', fd);
  } catch (e) {
    // 横顔・目のアップで顔検出が失敗するのは想定内。行き止まりにせず手動ROIに誘導する
    if (!isManualRoi() && /no face/.test(e.message)) { fallbackToManualRoi(); return; }
    status('エラー: ' + e.message);
    return;
  }
  state.session = data.session_id;
  state.w = data.width; state.h = data.height;
  state.strokes = [];
  paintBackup = null;
  resetHistory();
  pctx.clearRect(0, 0, 4096, 4096);
  setLayerOptions(data.layers);
  document.getElementById('sessionId').value = data.session_id;
  status(`解析完了 (session ${data.session_id})。Probability を確認し、必要ならブラシで補正して Matting を実行してください。`);
};

document.getElementById('layerSelect').onchange = (e) => showLayer(e.target.value);

async function resumeSession(sid) {
  const res = await fetch(`/api/sessions/${sid}`);
  if (!res.ok) { status('エラー: ' + (await res.text())); return false; }
  const data = await res.json();
  state.session = sid;
  state.w = data.width; state.h = data.height;
  roiModeSelect.value = data.mode === 'manual' ? 'manual' : 'auto';
  state.roiA = data.roi_rect || null;
  state.roiB = data.dest_rect || null;
  updateRoiHint();
  paintBackup = null;
  resetHistory();
  // ストロークの再生前に表示を待つ（onload が paintCanvas をリサイズして中身を消すため）
  await setLayerOptions(data.layers);
  await loadStrokes(sid);
  restorePaint();
  status(`セッション ${sid} を復元しました（ブラシストローク ${state.strokes.length} 本）。`);
  return true;
}

function currentSessionId() {
  return (document.getElementById('sessionId').value || '').trim() || state.session;
}

document.getElementById('btnResume').onclick = async () => {
  const sid = currentSessionId();
  if (!sid) { status('セッションID を入力してください'); return; }
  await resumeSession(sid);
};

// 別マシン・別セッションへの引き継ぎ用。Supabase 未設定なら 503 が返る
document.getElementById('btnArchive').onclick = async () => {
  const sid = currentSessionId();
  if (!sid) { status('セッションID を入力してください'); return; }
  status('退避中…（Supabase Storage へアップロード）');
  const res = await fetch(`/api/sessions/${sid}/archive`, { method: 'POST' });
  if (!res.ok) { status('エラー: ' + (await res.text())); return; }
  const data = await res.json();
  status(`セッション ${sid} を退避しました（${data.files.length} ファイル）。他の環境ではこのIDで「取り込み」できます。`);
};

document.getElementById('btnArchiveRestore').onclick = async () => {
  const sid = (document.getElementById('sessionId').value || '').trim();
  if (!sid) { status('取り込むセッションID を入力してください'); return; }
  status('取り込み中…（Supabase Storage からダウンロード）');
  const res = await fetch(`/api/sessions/${sid}/archive/restore`, { method: 'POST' });
  if (!res.ok) { status('エラー: ' + (await res.text())); return; }
  await resumeSession(sid);
};

function setBrush(mode, btn) {
  state.brush = mode;
  for (const id of ['btnAdd', 'btnUnknown', 'btnRemove', 'btnNone'])
    document.getElementById(id).classList.remove('brush-active');
  if (btn) btn.classList.add('brush-active');
  paintCanvas.style.pointerEvents = mode ? 'auto' : 'none';
  paintCanvas.style.cursor = mode ? 'crosshair' : 'default';
}
document.getElementById('btnAdd').onclick = (e) => setBrush('add', e.target);
document.getElementById('btnUnknown').onclick = (e) => setBrush('unknown', e.target);
document.getElementById('btnRemove').onclick = (e) => setBrush('remove', e.target);
document.getElementById('btnNone').onclick = () => setBrush(null, null);
document.getElementById('btnClear').onclick = () => {
  pctx.clearRect(0, 0, state.w, state.h);
  state.strokes = [];
  savePaint();
  persistStrokes();
};
updateHistoryButtons();
setBrush(null, null);

function dab(tool, x, y, r) {
  pctx.globalAlpha = 0.55;
  pctx.fillStyle = COLOR_OF[tool];
  pctx.beginPath(); pctx.arc(x, y, r, 0, Math.PI * 2); pctx.fill();
  pctx.globalAlpha = 1;
}

function paintAt(e) {
  const rect = paintCanvas.getBoundingClientRect();
  // 表示はズーム倍率でスケールされるので、画像座標へ戻して塗る
  const x = (e.clientX - rect.left) / state.zoom, y = (e.clientY - rect.top) / state.zoom;
  const r = +document.getElementById('brushSize').value;
  dab(TOOL_OF[state.brush], x, y, r);
  if (state.current) state.current.points.push([Math.round(x), Math.round(y)]);
}

function replayStrokes(strokes) {
  pctx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
  for (const s of strokes) for (const [x, y] of s.points) dab(s.tool, x, y, s.radius);
  paintBackup = pctx.getImageData(0, 0, state.w, state.h);
}

async function persistStrokes() {
  if (!state.session) return;
  const body = { width: state.w, height: state.h, strokes: state.strokes };
  await fetch(`/api/sessions/${state.session}/strokes`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
}

async function loadStrokes(sessionId) {
  const res = await fetch(`/api/sessions/${sessionId}/strokes`);
  if (!res.ok) return;
  const data = await res.json();
  state.strokes = data.strokes;
  if (state.strokes.length) replayStrokes(state.strokes);
}

paintCanvas.addEventListener('pointerdown', (e) => {
  if (!state.brush) return;
  state.painting = true;
  state.current = {
    tool: TOOL_OF[state.brush], radius: +document.getElementById('brushSize').value, points: [],
  };
  paintAt(e);
});
paintCanvas.addEventListener('pointermove', (e) => { if (state.painting) paintAt(e); });
window.addEventListener('pointerup', () => {
  if (!state.painting) return;
  state.painting = false;
  if (state.current && state.current.points.length) state.strokes.push(state.current);
  state.current = null;
  savePaint();
  persistStrokes();
});

document.getElementById('btnRecompose').onclick = async () => {
  if (!state.session) { status('まだセッションがありません。装着画像を選んで「解析開始」を押してください'); return; }
  const fe = document.getElementById('fileEdited').files[0];
  if (!fe) { status('編集済み画像を選択してください'); return; }
  if (isManualRoi() && !state.roiB) {
    status('加工画像で ROI-B を指定してください');
    armRoi('b');
    return;
  }
  status(isManualRoi() ? '再合成中…（ROI-Bへ貼付）' : '再合成中…（顔検出・位置合わせ・Alpha合成）');
  const fd = new FormData();
  fd.append('session_id', state.session);
  fd.append('edited_image', fe);
  if (isManualRoi() && state.roiB) fd.append('dest_rect', state.roiB.map(Math.round).join(','));
  try {
    const result = await postForm('/api/recompose', fd);
    if (result.dest_rect) state.roiB = result.dest_rect;
  } catch (e) {
    status('エラー: ' + e.message);
    return;
  }
  const sel = document.getElementById('layerSelect');
  const layers = [...sel.options].map(o => o.value);
  if (!layers.includes('source_edited')) layers.push('source_edited');
  if (!layers.includes('composite_on_edited')) layers.push('composite_on_edited');
  setLayerOptions(layers);
  sel.value = 'composite_on_edited';
  showLayer('composite_on_edited');
  status('再合成完了。「表示中レイヤーを保存」でダウンロードできます。');
};

const setProgress = (pct) => document.getElementById('progressBar').style.width = `${pct}%`;

async function connectRealtime() {
  const cfg = (await (await fetch('/api/config')).json()).supabase;
  if (!cfg.realtime) return null;
  const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
  return createClient(cfg.url, cfg.publishable_key);
}

function onJobUpdate(job, resolve) {
  setProgress(job.progress);
  if (job.status === 'running') status(`Matting 実行中… ${job.stage || ''} ${job.progress}%`);
  if (job.status === 'done' || job.status === 'failed') resolve(job);
}

function followWithRealtime(jobId) {
  return new Promise((resolve) => {
    state.channel = state.supabase
      .channel(`matte_job_${jobId}`)
      .on('postgres_changes',
        { event: 'UPDATE', schema: 'public', table: 'matte_jobs', filter: `id=eq.${jobId}` },
        (payload) => onJobUpdate(payload.new, resolve))
      .subscribe();
  }).finally(() => { state.supabase.removeChannel(state.channel); state.channel = null; });
}

async function followWithPolling(jobId) {
  for (;;) {
    const job = await (await fetch(`/api/matte/jobs/${jobId}`)).json();
    let finished = null;
    onJobUpdate(job, (j) => { finished = j; });
    if (finished) return finished;
    await new Promise((r) => setTimeout(r, 400));
  }
}

document.getElementById('btnMatte').onclick = async () => {
  if (!state.session) { status('まだセッションがありません。装着画像を選んで「解析開始」を押してください'); return; }
  status('Matting をキューに投入中…');
  setProgress(0);
  document.getElementById('btnMatte').disabled = true;
  const fd = new FormData();
  fd.append('session_id', state.session);
  fd.append('fg_thresh', (+document.getElementById('fgThresh').value / 100).toString());
  fd.append('bg_thresh', (+document.getElementById('bgThresh').value / 100).toString());
  const blank = !paintBackup || paintBackup.data.every((v, i) => (i % 4 !== 3) || v === 0);
  if (!blank) fd.append('constraints_png', paintCanvas.toDataURL('image/png'));
  try {
    let jobId;
    try {
      ({ job_id: jobId } = await postForm('/api/matte/jobs', fd));
    } catch (e) {
      status('エラー: ' + e.message);
      return;
    }
    const job = state.supabase ? await followWithRealtime(jobId) : await followWithPolling(jobId);
    if (job.status === 'failed') { status('Matting 失敗: ' + job.error); return; }
    const prev = [...document.getElementById('layerSelect').options].map(o => o.value);
    const base = ['roi_a'];
    if (document.getElementById('fileWithout').files[0] || prev.includes('roi_b')) base.push('roi_b');
    const layers = [...base, ...prev.filter(isSourceLayer), 'difference', 'probability', ...job.result.layers];
    if (prev.includes('composite_on_edited')) layers.push('composite_on_edited');
    setLayerOptions(layers);
    status(`Matting 完了。再合成誤差 (mean abs, 0-255): ${job.result.reconstruction_error.toFixed(2)}`);
  } finally {
    document.getElementById('btnMatte').disabled = false;
    setProgress(0);
  }
};

const catalogInfo = (msg) => document.getElementById('catalogInfo').textContent = msg;

document.getElementById('btnRegister').onclick = async () => {
  if (!state.session) { catalogInfo('先に Matting を実行してください'); return; }
  const fd = new FormData();
  fd.append('session_id', state.session);
  fd.append('name', document.getElementById('assetName').value || `lash-${state.session}`);
  const brand = document.getElementById('assetBrand').value;
  if (brand) fd.append('brand', brand);
  const res = await fetch('/api/assets', { method: 'POST', body: fd });
  if (!res.ok) { catalogInfo('登録エラー: ' + (await res.text())); return; }
  catalogInfo('商品として登録しました。カタログで確認できます。');
};

(async () => { state.supabase = await connectRealtime(); })();
</script>
