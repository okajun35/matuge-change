<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>matuge-change PoC — 商品カタログ</title>
<link rel="stylesheet" href="/common.css">
</head>
<body>
<header><h1>matuge-change PoC — 商品カタログ</h1></header>

<nav>
  <a href="/" class="nav-active">カタログ</a>
  <a href="/extract.html">静止画モード</a>
  <a href="/video.html">動画モード</a>
</nav>

<div class="bar">
  <button id="btnRefreshAssets" class="secondary">カタログ更新</button>
  <a href="/extract.html"><button>商品を抽出して登録する</button></a>
  <span id="catalogInfo" style="font-size:13px;color:#9fd"></span>
</div>

<div class="status" id="status">カードをクリックすると形状の近い商品を表示します。</div>
<div id="assetList"></div>

<script>
const catalogInfo = (msg) => document.getElementById('catalogInfo').textContent = msg;
const status = (msg) => document.getElementById('status').textContent = msg;

async function refreshAssets() {
  const list = document.getElementById('assetList');
  const { assets } = await (await fetch('/api/assets')).json();
  list.innerHTML = '';
  for (const a of assets) {
    const card = document.createElement('div');
    card.className = 'asset checker';
    card.innerHTML = `<img src="/api/assets/${a.id}/image" alt="${a.name}">` +
      `<div>${a.name}</div><div style="color:#9ab">${a.brand || ''}</div>`;
    card.title = `alpha ${(a.alpha_coverage ?? 0).toFixed(3)} / err ${(a.recon_error ?? 0).toFixed(1)}`;
    card.onclick = () => showSimilar(a.id, a.name);
    list.appendChild(card);
  }
  catalogInfo(`${assets.length} 件`);
  if (!assets.length) status('登録済みの商品はまだありません。「静止画モード」でまつ毛を抽出して登録してください。');
}

async function showSimilar(assetId, name) {
  const { matches } = await (await fetch(`/api/assets/${assetId}/similar?limit=5`)).json();
  if (!matches.length) { status(`${name}: 類似商品はまだありません`); return; }
  status(`${name} に近い形状: ` +
    matches.map(m => `${m.name} (${(m.similarity * 100).toFixed(1)}%)`).join(' / '));
}

document.getElementById('btnRefreshAssets').onclick = refreshAssets;
refreshAssets();
</script>
</body>
</html>
