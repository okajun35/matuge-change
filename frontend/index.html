<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>matuge-change PoC — 商品カタログ</title>
<link rel="stylesheet" href="/common.css">
</head>
<body>
<header><h1>matuge-change PoC — 商品カタログ</h1></header>

<nav>
  <a href="/" class="nav-active">カタログ</a>
  <a href="/extract.html">静止画モード</a>
  <a href="/video.html">動画モード</a>
</nav>

<div class="bar">
  <label>検索 <input type="text" id="assetQuery" placeholder="商品名 / ブランド"></label>
  <button id="btnRefreshAssets" class="secondary">カタログ更新</button>
  <a href="/extract.html"><button>商品を抽出して登録する</button></a>
  <span id="catalogInfo" style="font-size:13px;color:#9fd"></span>
</div>

<div class="status" id="status">カードをクリックすると形状の近い商品を表示します。</div>
<div id="assetList"></div>
<div id="assetPager">
  <button id="btnPrevPage" class="secondary">‹ 前へ</button>
  <span id="pageInfo"></span>
  <button id="btnNextPage" class="secondary">次へ ›</button>
</div>

<script>
const catalogInfo = (msg) => document.getElementById('catalogInfo').textContent = msg;
const status = (msg) => document.getElementById('status').textContent = msg;

const PAGE_SIZE = 12;
const catalogPage = { offset: 0, query: '' };

async function refreshAssets() {
  const list = document.getElementById('assetList');
  const params = new URLSearchParams({ limit: PAGE_SIZE, offset: catalogPage.offset });
  if (catalogPage.query) params.set('q', catalogPage.query);
  const { assets, total, offset } = await (await fetch(`/api/assets?${params}`)).json();
  if (offset > 0 && assets.length === 0) {   // 末尾ページが空になったら戻す
    catalogPage.offset = Math.max(0, offset - PAGE_SIZE);
    return refreshAssets();
  }
  list.innerHTML = '';
  for (const a of assets) {
    const card = document.createElement('div');
    card.className = 'asset checker';
    card.innerHTML = `<img src="/api/assets/${a.id}/image" alt="${a.name}">` +
      `<div>${a.name}</div><div style="color:#9ab">${a.brand || ''}</div>` +
      `<div class="asset-actions">` +
      `<a href="/api/assets/${a.id}/image" download="${a.name}.png" title="アルファ付きRGBA PNG">RGBA</a>` +
      `<a href="/api/assets/${a.id}/mask" download="${a.name}-mask.png" title="アルファのみ（白黒マスク）">マスク</a></div>`;
    card.title = `alpha ${(a.alpha_coverage ?? 0).toFixed(3)} / err ${(a.recon_error ?? 0).toFixed(1)}`;
    card.onclick = (e) => { if (e.target.tagName !== 'A') showSimilar(a.id, a.name); };
    list.appendChild(card);
  }
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  const current = Math.floor(offset / PAGE_SIZE) + 1;
  document.getElementById('pageInfo').textContent = `${current} / ${pages} ページ（全 ${total} 件）`;
  document.getElementById('btnPrevPage').disabled = offset === 0;
  document.getElementById('btnNextPage').disabled = offset + PAGE_SIZE >= total;
  catalogInfo(`${total} 件`);
  if (!total) status('登録済みの商品はまだありません。「静止画モード」でまつ毛を抽出して登録してください。');
}

async function showSimilar(assetId, name) {
  const { matches } = await (await fetch(`/api/assets/${assetId}/similar?limit=5`)).json();
  if (!matches.length) { status(`${name}: 類似商品はまだありません`); return; }
  status(`${name} に近い形状: ` +
    matches.map(m => `${m.name} (${(m.similarity * 100).toFixed(1)}%)`).join(' / '));
}

document.getElementById('btnRefreshAssets').onclick = () => { catalogPage.offset = 0; refreshAssets(); };
document.getElementById('btnPrevPage').onclick = () => {
  catalogPage.offset = Math.max(0, catalogPage.offset - PAGE_SIZE);
  refreshAssets();
};
document.getElementById('btnNextPage').onclick = () => {
  catalogPage.offset += PAGE_SIZE;
  refreshAssets();
};
let queryTimer = null;
document.getElementById('assetQuery').oninput = (e) => {
  clearTimeout(queryTimer);
  queryTimer = setTimeout(() => {
    catalogPage.query = e.target.value.trim();
    catalogPage.offset = 0;
    refreshAssets();
  }, 250);
};
refreshAssets();
</script>
</body>
</html>
