<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>matuge-change PoC — 動画モード</title>
<link rel="stylesheet" href="/common.css">
<style>
  #videoStage { padding: 12px 16px; }
  #videoStage img, #videoStage video { max-width: 96vw; max-height: 70vh; display: block; margin-top: 8px; }
</style>
</head>
<body>
<header><h1>matuge-change PoC — 動画モード（目元領域まるごと差し替え）</h1></header>

<nav>
  <a href="/">カタログ</a>
  <a href="/extract.html">静止画モード</a>
  <a href="/video.html" class="nav-active">動画モード</a>
</nav>

<div class="bar">
  <label>動画: <input type="file" id="fileVideo" accept="video/*"></label>
  <button id="btnVideoUpload">解析開始（ベストフレーム選択）</button>
  <a id="btnBestFrame" download="best_frame.png" style="display:none"><button class="secondary">ベストフレームを保存</button></a>
  <span class="sep"></span>
  <label>AI加工済み画像: <input type="file" id="fileVideoEdited" accept="image/*"></label>
  <label>目元領域の広さ <input type="range" id="expandRange" min="15" max="90" value="45"></label>
  <button id="btnCompose">動画合成</button>
  <a id="btnVideoDownload" download="output.mp4" style="display:none"><button class="secondary">合成動画を保存</button></a>
</div>

<div class="status" id="videoStatus">動画をアップロードしてください。ベストフレームを保存→外部でAI加工（目元は変えない指示推奨）→加工済み画像を選んで「動画合成」。</div>

<div id="videoStage">
  <img id="bestFrameImg" style="display:none" alt="best frame">
  <video id="outputVideo" controls loop style="display:none"></video>
</div>

<script>
const state = { videoSession: null };
const vstatus = (msg) => document.getElementById('videoStatus').textContent = msg;

document.getElementById('btnVideoUpload').onclick = async () => {
  const fv = document.getElementById('fileVideo').files[0];
  if (!fv) { vstatus('動画を選択してください'); return; }
  const fd = new FormData();
  fd.append('video', fv);
  vstatus('解析中…（フレーム分解・全フレームの顔検出・ベストフレーム選択。動画長に応じて時間がかかります）');
  document.getElementById('btnVideoUpload').disabled = true;
  try {
    const res = await fetch('/api/video/session', { method: 'POST', body: fd });
    if (!res.ok) { vstatus('エラー: ' + (await res.text())); return; }
    const data = await res.json();
    state.videoSession = data.session_id;
    const img = document.getElementById('bestFrameImg');
    img.src = `/api/image/${data.session_id}/best_frame?t=${Date.now()}`;
    img.style.display = '';
    document.getElementById('outputVideo').style.display = 'none';
    document.getElementById('btnVideoDownload').style.display = 'none';
    const bf = document.getElementById('btnBestFrame');
    bf.href = `/api/image/${data.session_id}/best_frame`;
    bf.style.display = '';
    vstatus(`解析完了: ${data.frame_count}フレーム / ${data.fps.toFixed(1)}fps、ベストフレーム #${data.best_frame_index}。この画像を保存してAI加工し、加工済み画像を選んで「動画合成」を押してください。`);
  } finally {
    document.getElementById('btnVideoUpload').disabled = false;
  }
};

document.getElementById('btnCompose').onclick = async () => {
  if (!state.videoSession) { vstatus('先に動画を解析してください'); return; }
  const fe = document.getElementById('fileVideoEdited').files[0];
  if (!fe) { vstatus('AI加工済み画像を選択してください'); return; }
  const fd = new FormData();
  fd.append('session_id', state.videoSession);
  fd.append('edited_image', fe);
  fd.append('expand', (+document.getElementById('expandRange').value / 100).toString());
  vstatus('合成中…（全フレームへ目元領域を合成して動画を再生成しています）');
  document.getElementById('btnCompose').disabled = true;
  try {
    const res = await fetch('/api/video/compose', { method: 'POST', body: fd });
    if (!res.ok) { vstatus('エラー: ' + (await res.text())); return; }
    const data = await res.json();
    const vid = document.getElementById('outputVideo');
    vid.src = `/api/video/${state.videoSession}/output?t=${Date.now()}`;
    vid.style.display = '';
    document.getElementById('bestFrameImg').style.display = 'none';
    const dl = document.getElementById('btnVideoDownload');
    dl.href = `/api/video/${state.videoSession}/output`;
    dl.style.display = '';
    vstatus(`合成完了（${data.frame_count}フレーム）。目元に違和感がある場合は「目元領域の広さ」を調整して再合成してください。`);
  } finally {
    document.getElementById('btnCompose').disabled = false;
  }
};
</script>
</body>
</html>
